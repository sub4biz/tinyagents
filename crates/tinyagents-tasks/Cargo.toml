[package]
publish = false
name = "tinyagents-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Graph-independent detached-task registry, task stores and orchestration controls for TinyAgents."

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.3", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.3.0" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.5.0" }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }

[dev-dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
